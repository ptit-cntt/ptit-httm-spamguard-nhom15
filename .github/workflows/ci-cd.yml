# CI/CD: lint -> unit/API test -> build & push Docker image -> deploy (main).
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài dependencies (không cần torch cho test)
        run: pip install -r requirements-api.txt pandas pytest httpx ruff
      - name: Lint
        run: ruff check src services scripts tests
      - name: Unit + API tests
        run: pytest -q tests

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Tên image trên GHCR bắt buộc viết thường (tổ chức "PTIT-CNTT" có chữ hoa)
      - name: Chuẩn hoá tên image
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    # Chỉ deploy khi đã cấu hình secrets cho server đích
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy qua SSH (docker compose pull && up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/spamguard
            docker compose pull api
            docker compose up -d api
            # Smoke test sau deploy, lỗi -> job fail
            sleep 10 && curl -fsS http://localhost:8000/ready
